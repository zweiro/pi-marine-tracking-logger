# Sea Turtle Tracking App - Docker Compose Configuration

services:
  # MongoDB Database
  mongodb:
    build:
      context: ./docker/mongodb
      dockerfile: Dockerfile
    container_name: turtle-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_logs:/var/log/mongodb
    networks:
      - turtle-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Mock Satellite API (for development)
  mock-satellite:
    build:
      context: ./mock-satellite
      dockerfile: Dockerfile
    container_name: turtle-mock-satellite
    ports:
      - "8001:8001"
    environment:
      - AUTO_GENERATE_ENABLED=true
      - AUTO_GENERATE_INTERVAL_SECONDS=60
      - TURTLE_IDS=HONU-001,CARI-002,MEDI-003
    networks:
      - turtle-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: turtle-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DATABASE=turtle_tracking
      - DEBUG=false
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173"]
      # Satellite polling configuration
      - SATELLITE_POLLING_ENABLED=false
      - SATELLITE_POLLING_INTERVAL_SECONDS=30
      - SATELLITE_API_URL=http://mock-satellite:8001
    depends_on:
      mongodb:
        condition: service_healthy
      mock-satellite:
        condition: service_healthy
    networks:
      - turtle-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Vue.js Frontend (with hot-reload for development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: turtle-frontend
    ports:
      - "3000:3000"
    volumes:
      # Mount source for hot-reload (exclude node_modules)
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    environment:
      - VITE_API_URL=/api/v1
    depends_on:
      - backend
    networks:
      - turtle-network
    restart: unless-stopped

networks:
  turtle-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_logs:
    driver: local
